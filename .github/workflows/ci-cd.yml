name: CCA2 CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Automated tests
        run: npm test

  build:
    name: Docker build and smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t queuewise:${{ github.sha }} .
      - name: Start container
        run: docker run -d --name queuewise-smoke -p 3000:3000 queuewise:${{ github.sha }}
      - name: Wait for application
        run: sleep 3
      - name: Health smoke test
        run: curl --fail --show-error --silent http://127.0.0.1:3000/health
      - name: Stop container
        if: always()
        run: docker rm -f queuewise-smoke

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to Render
        env:
          DEPLOY_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "ERROR: RENDER_DEPLOY_HOOK_URL is not available."
            exit 1
          fi
          curl -fsS -X POST "${DEPLOY_URL}&ref=${{ github.sha }}"
